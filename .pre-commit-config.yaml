repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: python -m ruff check
        language: system
        types: [python]

      - id: black
        name: Black
        entry: python -m black --check
        language: system
        types: [python]

      - id: eslint
        name: ESLint
        entry: node frontend/node_modules/eslint/bin/eslint.js
        language: system
        files: ^frontend/.*\.ts$
        types: [file]

      - id: prettier
        name: Prettier
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --check
        language: system
        files: ^frontend/.*\.(ts|json|mjs)$
        types: [file]
