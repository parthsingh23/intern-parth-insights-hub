repos:
  - repo: local
    hooks:
    - id: ruff
      name: Ruff
      entry: .venv/bin/ruff check
      language: system
      types: [python]

    - id: black
      name: black
      entry: .venv/bin/black --check
      language: system
      types: [python]

    - id: eslint
      name: ESLint
      entry: frontend/node_modules/.bin/eslint
      language: system
      files: ^frontend/.*\.ts$
      types: [file]

    - id: prettier
      name: Prettier
      entry: frontend/node_modules/.bin/prettier --check
      language: system
      files: ^frontend/.*\.(ts|json|mjs)$
      types: [file]
